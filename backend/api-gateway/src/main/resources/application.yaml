server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: finance-categories
              uri: http://localhost:8081
              predicates:
                - Path=/api/categories/**
            - id: finance-transactions
              uri: http://localhost:8081
              predicates:
                - Path=/api/transactions/**
            - id: finance-dashboard
              uri: http://localhost:8081
              predicates:
                - Path=/api/dashboard/**
            - id: notification-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/notifications/**
            # auth-service ainda não tem endpoints; a rota entra quando ele for implementado.
